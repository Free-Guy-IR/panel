snapshot = "upstream-forks/subscription-template.refs"
reason = "no tracker of its own"

[[repo]]
name = "mtg"
mode = "covered-by"
fork = "Free-Guy-IR/mtg"
upstream = "9seconds/mtg"
covered_by = "node"
reason = "the node drift check watches mtg releases, advisories and security commits against the pin in the node go.mod"

[[repo]]
name = "sing-box"
