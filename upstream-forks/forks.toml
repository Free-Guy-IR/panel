[[repo]]
name = "mtg"
mode = "ledger"
fork = "Free-Guy-IR/mtg"
upstream = "9seconds/mtg"
ported_ref = "main"
grandfathered_base = "d095108334deb1512f4b7aece588f6e00f5ec428"
ledger = "upstream-forks/mtg.md"
snapshot = "upstream-forks/mtg.refs"
release_refs = ["refs/remotes/upstream/master", "refs/upstream-tags/*"]
reason = "every 9seconds/mtg branch and tag is tracked here commit by commit against fork main, the fork default branch, which carries fork master and the merge of upstream v2.3.0; upstream releases from master. The node dropped its mtg require and replace on 2026-11-10 with the MTProto backend, so no node pin points here any more; the fork repository stays tracked so the backend can be rebuilt from work/r11/MED/mtproto.med without starting the mtg fork over"

[[repo]]
name = "sing-box"
mode = "covered-by"
fork = "Free-Guy-IR/sing-box"
upstream = "SagerNet/sing-box"
covered_by = "node-drift"
reason = "the fork is a patch branch (v1.13.14-hotreload) on a sing-box release, not a mirror of upstream development; the node drift check watches sing-box and sing-quic releases, advisories and security commits against the pin in the node Dockerfile"

