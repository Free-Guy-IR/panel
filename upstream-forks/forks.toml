[[repo]]
name = "panel"
mode = "self"
fork = "Free-Guy-IR/panel"
upstream = "PasarGuard/panel"
tracker_path = ".github/workflows/upstream-inventory.yml"
reason = "tracked by this repository's upstream parity gate against UPSTREAM_SYNC.md and .upstream-refs"

[[repo]]
name = "node"
mode = "ledger"
fork = "Free-Guy-IR/node"
upstream = "PasarGuard/node"
ported_ref = "main"
grandfathered_base = "e9a9ba286413c404854b80c847b588b620426660"
ledger = "upstream-forks/node.md"
snapshot = "upstream-forks/node.refs"
reason = "every PasarGuard/node branch and tag is tracked here commit by commit against the published fork main, independent of the node repository's own drift check"

[[repo]]
name = "node-drift"
mode = "workflow"
fork = "Free-Guy-IR/node"
upstream = "PasarGuard/node"
tracker_branch = "main"
tracker_path = ".github/workflows/upstream-drift.yml"
pending_until = "2026-10-20"
pending_reason = "the drift check (scripts/upstream_drift.sh with .github/upstream-waivers.txt, first added in node commit ed5fd64) is only on unpublished node branches (release/v0.6.21 and release/v0.6.21-acct-drift6) and reaches main with the 0.6.21 release; until then Xray-core, sing-box and sing-quic releases and advisories are watched only by that unpublished check"
reason = "the node drift check watches Xray-core, sing-box and sing-quic releases, security commits and advisories against the pins in the node Dockerfile; its mtg section was retired on 2026-11-10 with the MTProto backend"

[[repo]]
name = "scripts"
mode = "ledger"
fork = "Free-Guy-IR/scripts"
upstream = "PasarGuard/scripts"
ported_ref = "main"
grandfathered_base = "5fa4eac7fa7817dda7bbe0e0b2a3e7228b2e1f8d"
ledger = "upstream-forks/scripts.md"
snapshot = "upstream-forks/scripts.refs"
reason = "every PasarGuard/scripts branch and tag is tracked here commit by commit against the published fork main"

[[repo]]
name = "node_bridge_py"
mode = "ledger"
fork = "Free-Guy-IR/node_bridge_py"
upstream = "PasarGuard/node_bridge_py"
ported_ref = "main"
grandfathered_base = "7d6968b712411f6ed70b3073e1998fec2ab23c06"
ledger = "upstream-forks/node_bridge_py.md"
snapshot = "upstream-forks/node_bridge_py.refs"
reason = "no tracker of its own; its proto-drift workflow only compares protobuf files"

