name: Upstream Inventory

on:
  pull_request:
  push:
    branches: ["**"]
  schedule:
    - cron: "24 6 * * *"
    - cron: "24 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependencies
        run: python -m pip install "packaging==26.3" "pytest==9.1.1" "markdown-it-py==4.0.0" "mdurl==0.1.2"

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream https://github.com/PasarGuard/panel.git 2>/dev/null || \
            git remote set-url upstream https://github.com/PasarGuard/panel.git
          git for-each-ref --format='%(objectname) %(refname)' refs/tags > "$RUNNER_TEMP/fork-tags-before"
          git fetch --no-tags --prune upstream "+refs/heads/*:refs/remotes/upstream/*"
          git fetch --no-tags upstream "+refs/tags/*:refs/upstream-tags/*"
          git for-each-ref --format='%(objectname) %(refname)' refs/tags > "$RUNNER_TEMP/fork-tags-after"
          diff "$RUNNER_TEMP/fork-tags-before" "$RUNNER_TEMP/fork-tags-after"
          live_dev=$(git rev-parse --verify refs/remotes/upstream/dev)
          live_main=$(git rev-parse --verify refs/remotes/upstream/main)
          baseline=$(cat .upstream-baseline)
          sync_point=$(cat .upstream-sync-point)
          [[ "$baseline" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$sync_point" =~ ^[0-9a-f]{40}$ ]]
          echo "BASELINE=$baseline" >> "$GITHUB_ENV"
          echo "SYNC_POINT=$sync_point" >> "$GITHUB_ENV"
          {
            echo "## Live upstream heads checked"
            echo
            echo "- PasarGuard/panel dev: \`$live_dev\`"
            echo "- PasarGuard/panel main: \`$live_main\`"
            echo "- branches: $(git for-each-ref refs/remotes/upstream | wc -l), tags: $(git for-each-ref refs/upstream-tags | wc -l)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inventory report
        run: |
          python scripts/upstream_inventory.py \
            --base "refs/upstream-tags/$BASELINE" --head HEAD --upstream-head "$SYNC_POINT" \
            --json-file upstream-inventory.json > inventory-summary.md
          cat inventory-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-inventory
          path: |
            upstream-inventory.json
            inventory-summary.md
          retention-days: 30

      - name: Ledger gate
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          python scripts/upstream_inventory.py \
            --base "refs/upstream-tags/$BASELINE" --head HEAD --upstream-head "$SYNC_POINT" \
            --fail-on-override-outside-ledger OVERRIDES.md

      - name: Fetch upstream heads kept by the refs snapshot
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          if [ -f .upstream-refs ]; then
            awk '$1 ~ /^[0-9a-f]{40}$/ {print $1}' .upstream-refs | sort -u | while read -r sha; do
              git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags upstream "$sha" || true
            done
          fi

      - name: Upstream parity gate
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          status=0
          python scripts/upstream_inventory.py \
            --base "refs/upstream-tags/$BASELINE" --head HEAD \
            --track 'refs/remotes/upstream/*' --track 'refs/upstream-tags/*' \
            --fail-on-unported UPSTREAM_SYNC.md \
            --upstream-head "$SYNC_POINT" \
            --release-ref refs/remotes/upstream/main --release-ref refs/remotes/upstream/dev \
            --release-ref 'refs/upstream-tags/*' \
            --release-scope-ref refs/remotes/upstream/main --release-scope-ref 'refs/upstream-tags/*' \
            --grandfathered-base b56ffe369f542152c52c69733205baeaf3f6e4cd \
            --refs-snapshot .upstream-refs > upstream-parity.txt 2>&1 || status=$?
          cat upstream-parity.txt
          {
            echo "## Upstream parity"
            echo
            echo '```'
            cat upstream-parity.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Fork tracker coverage
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          python scripts/upstream_forks.py --config upstream-forks/forks.toml --owner Free-Guy-IR \
            > fork-trackers.txt 2>&1 || status=$?
          cat fork-trackers.txt
          {
            echo "## Fork tracker coverage"
            echo
            echo '```'
            cat fork-trackers.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Bridge version gate
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          python scripts/upstream_inventory.py \
            --base "refs/upstream-tags/$BASELINE" --head HEAD --upstream-head "$SYNC_POINT" --check-bridge

      - name: Npm package gate
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          python scripts/upstream_inventory.py \
            --base "refs/upstream-tags/$BASELINE" --head HEAD --upstream-head "$SYNC_POINT" --check-npm

      - name: Gate self-test
        if: ${{ !cancelled() }}
        run: |
          python -m pytest --noconftest -o filterwarnings= -p no:cacheprovider -q \
            tests/test_upstream_inventory.py tests/test_upstream_forks.py
