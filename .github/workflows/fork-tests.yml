name: Fork Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-frozen-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TEST_FROM: local
      TESTING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the upstream branches and tags by name
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/PasarGuard/panel.git "+refs/heads/*:refs/remotes/upstream/*"
          git fetch --no-tags https://github.com/PasarGuard/panel.git "+refs/tags/*:refs/upstream-tags/*"
          echo "upstream branches: $(git for-each-ref refs/remotes/upstream | wc -l), tags: $(git for-each-ref refs/upstream-tags | wc -l)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Install exactly the locked dependencies
        run: uv sync --frozen --group dev

      - name: Import the node runtime against the locked bridge
        run: uv run --frozen python -c "import app.node, app.app_factory"

      - name: Install the pinned NATS server
        env:
          NATS_VERSION: v2.10.25
          NATS_SHA256: 8a54ebad5f08311257e4267a96c5333ae58667c3ef50a7897bce00e01f6d8d6c
        run: |
          set -euo pipefail
          archive="nats-server-${NATS_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/${archive}"
          echo "${NATS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/nats-server-${NATS_VERSION}-linux-amd64/nats-server"
          "$binary" --version
          echo "NATS_SERVER_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Run the test suite on SQLite
        run: uv run --frozen pytest tests -q -p no:cacheprovider
