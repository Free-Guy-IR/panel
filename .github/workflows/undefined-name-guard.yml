name: Undefined-name guard

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  undefined-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff - undefined / redefined names only
        run: uvx ruff check app main.py config.py --select F821,F811,F823 --no-cache
