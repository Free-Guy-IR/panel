name: Build-Docker

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: write
    packages: write
    id-token: write

env:
    IMAGE_NAME: free-guy-ir/${{ github.event.repository.name }}
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    generate-changelog:
        if: ${{ github.event_name == 'release' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Determine version range
              id: tags
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CURRENT_IS_PRERELEASE: ${{ github.event.release.prerelease }}
              run: |
                  current_tag="${GITHUB_REF_NAME}"
                  prev_tag=""

                  if [ "${CURRENT_IS_PRERELEASE}" != "true" ]; then
                    prev_tag="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
                      | jq -rs --arg current_tag "$current_tag" '
                          [.[][] | select(.draft == false and .prerelease == false and .tag_name != $current_tag) | .tag_name][0] // empty
                        ')"
                  fi

                  if [ -z "$prev_tag" ]; then
                    prev_tag="$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)"
                  fi

                  if [ -z "$prev_tag" ]; then
                    prev_tag="$(git rev-list --max-parents=0 HEAD)"
                  fi

                  echo "previous=$prev_tag" >> "$GITHUB_OUTPUT"
                  echo "current=$current_tag" >> "$GITHUB_OUTPUT"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Generate changelog
              run: |
                  bunx changelogen@latest --from "${{ steps.tags.outputs.previous }}" --to "${{ steps.tags.outputs.current }}" \
                    | grep -v "Generating changelog for " \
                    | sed -e '/^\[log\]/d' -e '/./,$!d' > CHANGELOG.md

            - name: Update release notes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release edit "${{ github.event.release.tag_name }}" --notes-file CHANGELOG.md

            - name: Upload changelog artifact
              uses: actions/upload-artifact@v7
              with:
                  name: changelog
                  path: CHANGELOG.md
                  retention-days: 7

    build-dashboard:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Fetch sibling config kits
              run: |
                  # dashboard/package.json refers to these through file:../../<kit>, i.e.
                  # next to the panel checkout. Clone them there so bun resolves them the
                  # same way it does locally, and give each one its own node_modules: their
                  # compiled dist/ resolves imports from inside the kit, so it never reaches
                  # the dashboard's node_modules. Each kit ships its built dist/, so no
                  # TypeScript build is needed here.
                  KITS="core-kit@8d14f8fa5a62f422b47cbff46bd626e2a96d66b7 openvpn-config-kit@15ec50c87fd6a3d48cf7d1dc57b3eb0cddc9fab4 mtproto-config-kit@8eb84713f38e192c168b2d1cebb306fabe843795 l2tp-config-kit@fce077c58e97ae566f20aefdbbcec13a8ff869eb singbox-config-kit@4d3379787e714b32e94c83d9788a91adda674e15 wireguard-config-kit@e55aff7f46ad71e5ebc697d324f5fa0dce074dd3"
                  for entry in $KITS; do
                      kit="${entry%%@*}"
                      ref="${entry#*@}"
                      dir="$GITHUB_WORKSPACE/../$kit"
                      if [ "$ref" = "$entry" ]; then
                          git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$kit.git" "$dir"
                      else
                          git clone --filter=blob:none --no-checkout "https://github.com/${{ github.repository_owner }}/$kit.git" "$dir"
                          git -C "$dir" checkout --detach "$ref"
                          got="$(git -C "$dir" rev-parse HEAD)"
                          if [ "$got" != "$ref" ]; then
                              echo "::error::$kit resolved to $got, expected $ref"
                              exit 1
                          fi
                          echo "$kit pinned at $got"
                      fi
                  done
                  echo "KITS_PINNED=$KITS" >> "$GITHUB_ENV"
                  KITS="$(echo "$KITS" | tr " " "\n" | sed "s/@.*//" | tr "\n" " ")"
                  # Install only after every kit exists: core-kit resolves its
                  # siblings through file:../<kit>, so they must already be on disk.
                  for kit in $KITS; do
                      (cd "$GITHUB_WORKSPACE/../$kit" && bun install)
                  done

            - name: Install dependencies
              working-directory: ./dashboard
              run: bun install --frozen-lockfile

            - name: Report resolved config-kit versions
              working-directory: ./dashboard
              run: |
                  for kit in core-kit l2tp-config-kit mtproto-config-kit openvpn-config-kit singbox-config-kit wireguard-config-kit; do
                      f="node_modules/@pasarguard/$kit/package.json"
                      d="$GITHUB_WORKSPACE/../$kit"
                      version="(absent)"
                      commit="(absent)"
                      [ -f "$f" ] && version="$(node -p "require('./$f').version")"
                      [ -d "$d/.git" ] && commit="$(git -C "$d" rev-parse HEAD)"
                      echo "$kit -> $version @ $commit"
                  done

            - name: Verify pinned kits did not drift
              run: |
                  for entry in $KITS_PINNED; do
                      kit="${entry%%@*}"
                      ref="${entry#*@}"
                      if [ "$ref" = "$entry" ]; then
                          echo "::error::$kit is not pinned"
                          exit 1
                      fi
                      got="$(git -C "$GITHUB_WORKSPACE/../$kit" rev-parse HEAD)"
                      if [ "$got" != "$ref" ]; then
                          echo "::error::$kit drifted: $got != $ref"
                          exit 1
                      fi
                      echo "$kit verified at $got"
                  done

            - name: Build dashboard
              run: ./build_dashboard.sh

            - name: Upload dashboard build
              uses: actions/upload-artifact@v7
              with:
                  name: dashboard-build
                  path: ./dashboard/build/
                  retention-days: 1

    build-images:
        needs: build-dashboard
        strategy:
            matrix:
                arch: [amd64, arm64]
                include:
                    - arch: amd64
                      platform: linux/amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Download dashboard build
              uses: actions/download-artifact@v8
              with:
                  name: dashboard-build
                  path: ./dashboard/build/

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push ${{ matrix.arch }} image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  push: true
                  file: ./Dockerfile
                  tags: |
                      ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ matrix.arch }}
                  provenance: mode=max
                  sbom: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    push-manifest:
        needs: [build-images]
        runs-on: ubuntu-latest
        steps:
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Create tagged manifest for GitHub
              run: |
                  docker buildx imagetools create \
                    -t "ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" \
                    "ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-amd64" \
                    "ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-arm64"
                  docker buildx imagetools inspect "ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"

            - name: Create latest manifest for GitHub if not prerelease
              if: ${{ github.event_name == 'release' && github.event.release.prerelease != true }}
              run: |
                  docker buildx imagetools create \
                    -t "ghcr.io/${{ env.IMAGE_NAME }}:latest" \
                    "ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-amd64" \
                    "ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-arm64"
                  docker buildx imagetools inspect "ghcr.io/${{ env.IMAGE_NAME }}:latest"

            - name: Install cosign
              uses: sigstore/cosign-installer@v3

            - name: Sign the published image
              env:
                  IMAGE: ghcr.io/${{ env.IMAGE_NAME }}
                  TAG: ${{ github.ref_name }}
              run: |
                  DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
                  cosign sign --yes "${IMAGE}@${DIGEST}"
