name: Code Format Checker
on:
    push:
        branches:
            - "**"
        paths:
            - "**/*.py"

    pull_request:
        branches:
            - "**"
        paths:
            - "**/*.py"

jobs:
    ruff:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            - name: Install Ruff
              run: |
                  python -m pip install --upgrade pip
                  pip install "ruff==0.16.4"
            - name: Run Ruff Format
              run: |
                  ruff check --no-fix --output-format=github .
