name: Dashboard Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SMOKE_PORT: "8123"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Fetch sibling config kits
        run: |
            KITS="core-kit openvpn-config-kit mtproto-config-kit l2tp-config-kit singbox-config-kit wireguard-config-kit"
            for kit in $KITS; do
                git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$kit.git" "$GITHUB_WORKSPACE/../$kit"
            done
            for kit in $KITS; do
                (cd "$GITHUB_WORKSPACE/../$kit" && bun install)
            done

      - name: Install dashboard dependencies
        working-directory: ./dashboard
        run: bun install --frozen-lockfile

      - name: Build dashboard
        working-directory: ./dashboard
        run: VITE_BASE_API=/ bun run build --outDir build --assetsDir statics

      - name: Prove the static gate still discriminates
        run: |
            set -e
            rm -rf /tmp/smoke-positive /tmp/smoke-negative
            mkdir -p /tmp/smoke-positive/statics /tmp/smoke-negative/statics
            echo '<!doctype html><html><body></body></html>' > /tmp/smoke-positive/index.html
            echo '<!doctype html><html><body></body></html>' > /tmp/smoke-negative/index.html
            python3 - <<'EOF'
            from pathlib import Path

            conforming = "".join(
                f"var f{index}=(e,t)=>k(g{index}(e),{{...t,method:`GET`}});"
                for index in range(25)
            )
            Path("/tmp/smoke-positive/statics/api-fixture.js").write_text(conforming, encoding="utf-8")
            broken = conforming + "var bad=(e,t)=>k({url:`/api/admin`,method:`GET`,signal:e},t);"
            Path("/tmp/smoke-negative/statics/api-fixture.js").write_text(broken, encoding="utf-8")
            EOF
            if ! python3 scripts/dashboard_smoke.py --image-bundle /tmp/smoke-positive; then
                echo "the static gate rejected a conforming client; the gate would block every green build"
                exit 1
            fi
            python3 scripts/dashboard_smoke.py --image-bundle /tmp/smoke-negative > /tmp/smoke-negative.log 2>&1 && {
                echo "the static gate accepted a client with one broken call site among 25 correct ones"
                exit 1
            }
            grep -q "one-object mutator call" /tmp/smoke-negative.log || {
                echo "the static gate failed for the wrong reason:"
                cat /tmp/smoke-negative.log
                exit 1
            }
            echo "the static gate accepts a conforming client and rejects a single one-object call site"

      - name: Static gate
        run: |
            python3 scripts/dashboard_smoke.py \
                --client-source dashboard/src/service/api/index.ts \
                --image-bundle dashboard/build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install backend
        run: uv sync --frozen

      - name: Run migrations
        env:
          SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:///./smoke.db
        run: uv run alembic upgrade head

      - name: Start backend
        env:
          SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:///./smoke.db
          UVICORN_HOST: 127.0.0.1
          UVICORN_PORT: ${{ env.SMOKE_PORT }}
          DEBUG: "false"
          DOCS: "false"
          ROLE: all-in-one
          NATS_ENABLED: "false"
          DASHBOARD_PATH: /dashboard/
        run: |
            nohup uv run main.py > backend.log 2>&1 &
            echo $! > backend.pid

      - name: Wait for the backend to be ready
        run: |
            python3 - <<'EOF'
            import os
            import subprocess
            import sys
            import time
            import urllib.error
            import urllib.request

            port = int(os.environ["SMOKE_PORT"])
            base = f"http://127.0.0.1:{port}"
            probes = {"/health": 200, "/api/admin": 401, "/dashboard/": 200}
            deadline = time.time() + 180
            pending = dict(probes)
            last = {}
            while time.time() < deadline and pending:
                for path, expected in list(pending.items()):
                    try:
                        with urllib.request.urlopen(f"{base}{path}", timeout=3) as response:
                            status = response.status
                    except urllib.error.HTTPError as error:
                        status = error.code
                    except OSError as error:
                        last[path] = repr(error)
                        continue
                    last[path] = status
                    if status == expected:
                        del pending[path]
                if pending:
                    time.sleep(1)
            if pending:
                print(f"backend never became ready; expected {probes}, last seen {last}")
                subprocess.run(["tail", "-n", "120", "backend.log"], check=False)
                sys.exit(1)
            print(f"backend is ready: {probes}")
            EOF

      - name: Behavioural gate
        run: |
            python3 scripts/dashboard_smoke.py \
                --url "http://127.0.0.1:${SMOKE_PORT}/dashboard/" \
                --backend-log backend.log \
                --dom-out smoke-dom.html \
                --request-log-out smoke-requests.json

      - name: Stop backend
        if: always()
        run: |
            if [ -f backend.pid ]; then
                kill "$(cat backend.pid)" 2>/dev/null || true
            fi

      - name: Upload smoke evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-smoke-evidence
          path: |
            smoke-dom.html
            smoke-requests.json
            backend.log
          if-no-files-found: ignore
          retention-days: 7
