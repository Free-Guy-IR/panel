reason = "Re-decided 2026-11-11, superseding the accreted 2026-10-25 to 2026-11-10 text, with every claim below re-measured that day against the real repositories. The panel pin moves from 9619f473923d to 12eb93d9bdfa, which is fork bridge main, is 18 commits ahead of the old pin and has it as an ancestor, and whose GitHub Actions runs 42930601412 and 42930605759 (Tests) and 42930601436 (Proto drift check) are all completed/success for that exact sha. The move closes one gap the previous text tracked as blocked outside this repository: Masque is now present, with 13 hits under PasarGuardNodeBridge/ at the new pin against 13 at upstream v0.10.0 c5632b65 and 0 at the old pin, so the 2026-11-10 finding that no published fork bridge ref carries Masque at all no longer holds and tracker 9fa9f264cde1 in upstream-forks/node_bridge_py.md can be re-read. MAINTENANCE_TIMEOUTS of upstream #23 is present with 2 hits against upstream's 2. The reject-isolation work of upstream #27 is present, since its three fork commits 67b35df2e34e, e4fe5b12bc40 and c8b6707fb79a are all ancestors of the new pin, as is d6f43c7a0698 for the lifecycle lease confirmation of #32, so the panel is not missing a security fix at this pin. What upstream v0.10.0 still has and the fork bridge still lacks is the WireGuard pre-shared-key proto field of #26: upstream service.proto line 135 declares string pre_shared_key = 3 inside message Wireguard, 6 hits across service.proto, service_pb2.py and service_pb2.pyi, while the fork's message Wireguard carries only public_key = 1 and peer_ips = 2 and no pre-shared-key spelling of any form, so that part is a missing feature, not a missing fix. This file therefore cannot be deleted by a pin bump, which was measured rather than assumed: the gate compares only the public part of the pinned version, the fork bridge pyproject at 12eb93d9bdfa declares 0.9.2+singbox.4, uv 0.12.5 records that version in uv.lock, so the pin compares as 0.9.2 against PyPI 0.10.0 and the gate reports it behind whatever rev is pinned. Deleting this file on the new pin was tried and the bridge version gate exited 1 with no upstream-bridge-waiver.toml on HEAD. Clearing the gate for good needs a fork bridge release whose public version is 0.10.0 or above, which is only a truthful label once pre_shared_key is ported, and both are outside this repository. The panel's own pasarguard-node-bridge>=0.9.2 floor is left alone because it matches the pinned public version and uv does not enforce it against a git pin. security stays yes unchanged from the 2026-11-07 decision: the 2026-11-10 withdrawal of the exposure claim is confirmed here, nothing the fork bridge still lacks is a security fix, but this file does not weaken a gate on its own authority and main re-decides whether it becomes no. The date stays 2026-11-20 because owner decision 2026-11-03-main-spec005-lanes ends 2026-11-20 and the gate refuses an until past its owner decision's end, so the bump stays owed as 80d855f03557 in batch B-INFRA and this deadline cannot be moved without a new owner decision."
