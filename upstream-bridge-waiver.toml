reason = "Decided 2026-11-21 (UTC) by main under owner decision 2026-11-21-main-bridge-rollout-pin. The production rollout of CP1 and CP2 is gated on bridge 0.10.0: the rollout checklist pins bridge fork tag v0.10.0 (rev 5b21adc6b961, label 0.10.0+singbox.1, fork bridge main) and its release-image artifact check (gate G3, section 4.3) expects the installed pasarguard-node-bridge metadata to name that commit, so the panel pin stays at that rev until after the rollout. Upstream released v0.11.0 and v0.11.1 on 2026-11-16 and v0.11.2 on 2026-11-17 (PyPI 0.11.2). Their four code commits, 94dfc3abdc5e (maintenance call docstrings, README and tests), e27d6fca5bb7 (#35, fingerprint and system-trust TLS verification for node and HTTPS proxy connections), f851bbea3e3b (uvloop transports in the certificate expiry guard) and 959651999c76 (keep established TLS connections after certificate expiry), are being ported on the fork bridge branch port/bridge-v0.11.2, which on 2026-11-21 holds one cherry-pick with -x of each on top of 5b21adc6b961 and is not on GitHub yet; they are owed in the Port queue of upstream-forks/node_bridge_py.md with the same date, and its three version bumps are waived there as version-only. security is yes because #35 changes how the bridge verifies node TLS certificates and HTTPS proxies and keeps node API keys out of proxy CONNECT headers; whether the 0.10.0 pin is exposed to what it fixes was not measured."
