reason = "Re-decided 2026-10-25: upstream released node_bridge_py v0.9.3 (2026-10-18) and v0.9.4 (2026-10-22, PyPI 0.9.4) while the panel pins the fork bridge 0.9.2+singbox (rev 6116922). Under the 2026-10-14 release-only rule the bump is owed; main assigned the bridge v0.9.3/v0.9.4 port to PUSH-GATE on 2026-10-25 because it overlaps the reject-isolation work (PG-NODE owns node v0.5.5). The two releases carry the Masque proto message (#24), maintenance-call timeouts above node-serviced's deadline (#23) and one rejected user no longer stalling a node's sync queue (#27). Re-classified 2026-10-29 (B7-ADV2 B2-4 re-read): #27 is a security fix, since before it the disable, expire and delete changes queued behind one user a node rejects never reached that node and those users kept access, and the fork's 0.9.2+singbox has the stall; it is owed under main's 2026-10-28 ruling for reclassified entries the fork is affected by. Bridge v0.9.4 carries MASQUE, which the panel v5.5.1 sync needs (masque = 12), so this port cannot slip past that sync. The panel moves its pin to the fork's 0.9.4+singbox in that increment and deletes this file; if it is not on main by 2026-11-08 the gate fails again."
