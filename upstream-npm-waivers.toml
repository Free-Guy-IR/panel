reason = "Re-decided 2026-10-25, not extended: the 0.3.9 waiver expired on 2026-10-20 and upstream moved on to final npm releases xray-config-kit 0.3.10, 0.4.0 and 0.4.1, with core-kit 0.2.10 to 0.2.12 depending on them. Under the 2026-10-14 release-only rule this is an owed bump, not a waiver: main assigned it on 2026-10-25 to PUSH-GATE, which ports core-kit 0.2.12 and xray-config-kit 0.4.1 into Free-Guy-IR/core-kit, moves .github/config-kits.lock and reinstalls dashboard/bun.lock (today 0.3.8, nested 0.3.7). This entry only keeps the gate honest until that increment lands; PUSH-GATE deletes it in the same increment, and if the port is not on main by 2026-11-08 the gate fails again. Checked 2026-10-26: xray-config-kit 0.3.10, 0.4.0 and 0.4.1 (upstream PasarGuard/xray-config-kit 24009fb to fdcd5d0) add Xray v26.10.x parity data and MASQUE and XDrive support; none of them is a security fix. Re-checked 2026-11-02 (B0), date not extended: npm published xray-config-kit 0.4.2 on 2026-11-01 (and core-kit 0.3.0 the same day, which upstream panel dev 8ae9e31c1 adopts), so the waived version moves from 0.4.1 to 0.4.2 under the same 2026-11-08 deadline; 0.4.2 is a dashboard editor-kit release whose validator also rejects credentials inside an S3 endpoint URL, OSV lists no advisory against 0.4.1, and none of it is a security fix for the fork, whose bun.lock still resolves 0.3.8 (nested 0.3.7). PUSH-GATE now ports core-kit 0.3.0 with xray-config-kit 0.4.2. Re-decided 2026-11-03, security: no unchanged: PUSH-GATE no longer runs; the full v5.5.1 port of specs/005-upstream-v551-full-port owes the kit bumps 26ffdc21c, 3cde2dd84 and f2f56cfb7 (core-kit 0.2.12 with xray-config-kit 0.4.1) in batch B-DASH (branch port/b-dash, wave 1), which moves dashboard/bun.lock and deletes this entry or narrows it to 0.4.2, the version only upstream dev 8ae9e31c1 adopts; if that is not on main by 2026-11-20 the gate fails again."
